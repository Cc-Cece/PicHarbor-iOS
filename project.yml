# XcodeGen spec — the Xcode project is generated from this file in CI, so no
# fragile .xcodeproj is committed. Regenerate locally with:  xcodegen generate
#
# RENAME THE APP (one place drives everything):
#   1. Change `name:` below to your app name (used for the scheme, .xcodeproj,
#      product, and IPA file — the CI workflows read it automatically).
#   2. Update PRODUCT_BUNDLE_IDENTIFIER + INFOPLIST_KEY_CFBundleDisplayName.
#   3. Rename the test target (e.g. PicHarborTests) and its bundle id to match.
#   4. Optionally rename Sources/App/PicHarborApp.swift's `struct PicHarborApp`.
name: PicHarbor

options:
  developmentLanguage: zh-Hans
  bundleIdPrefix: com.cccece
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
  base:
    SWIFT_VERSION: "5.0"
    ONLY_ACTIVE_ARCH: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Unsigned build — signing is done on-device by the sideloading tool.
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    MARKETING_VERSION: "0.2.20"
    CURRENT_PROJECT_VERSION: "22"

targets:
  PicHarbor:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Runtime/ProxyNotices
        type: folder
      - path: Resources
        excludes: [Background.plist]
    dependencies:
      - framework: Runtime/Clash.xcframework
        embed: false
      - sdk: libresolv.tbd
      - framework: Runtime/Python.xcframework
        embed: true
        codeSign: false
    postBuildScripts:
      - name: Embed Python standard library and gpmc
        script: python3 "$PROJECT_DIR/tools/embed_python.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cccece.picharbor
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/BridgingHeader.h
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "浏览并备份你允许访问的照片与视频。"
        INFOPLIST_KEY_PHPhotoLibraryPreventAutomaticLimitedAccessAlert: "YES"
        INFOPLIST_FILE: Resources/Background.plist
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "PicHarbor"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"

  PicHarborTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PicHarbor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cccece.picharbor.tests
        GENERATE_INFOPLIST_FILE: "YES"

  PicHarborUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PicHarbor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cccece.picharbor.uitests
        TEST_TARGET_NAME: PicHarbor
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  PicHarbor:
    build:
      targets:
        PicHarbor: all
        PicHarborTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PicHarborTests
        - PicHarborUITests
    archive:
      config: Release
