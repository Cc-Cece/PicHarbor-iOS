name: Unit Tests (Simulator)

# Runs the unit tests on an iOS Simulator. Dispatch + pull-request only, to
# conserve free macOS minutes — the IPA build is the routine job on main.
# Reads the scheme name from project.yml's `name:` field.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Python build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache verified Python runtime archive
        uses: actions/cache@v4
        with:
          path: .runtime-cache/*.tar.gz
          key: python-ios-${{ runner.os }}-${{ hashFiles('tools/runtime-lock.json') }}

      - name: Prepare pinned Python runtime and dependencies
        run: python tools/prepare_python.py

      - name: Test adapter offline
        run: |
          python -m pip install -r Python/requirements.lock
          python -m unittest discover -s tests_python -v

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve app name
        id: app
        run: |
          set -euo pipefail
          NAME=$(awk -F':' '/^name:/{gsub(/["[:space:]]/,"",$2); print $2; exit}' project.yml)
          if [ -z "$NAME" ]; then echo "::error::Could not read 'name:' from project.yml"; exit 1; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          ID=$(xcrun simctl list devices available -j | python -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Prepare synthetic PhotoKit fixture
        run: |
          xcrun simctl boot '${{ steps.sim.outputs.id }}' || true
          xcrun simctl bootstatus '${{ steps.sim.outputs.id }}' -b
          python tools/generate_ui_fixture.py build/fixtures/picharbor.png
          xcrun simctl addmedia '${{ steps.sim.outputs.id }}' build/fixtures/picharbor.png
          xcrun simctl privacy '${{ steps.sim.outputs.id }}' grant photos com.cccece.picharbor

      - name: Run tests
        env:
          SCHEME: ${{ steps.app.outputs.name }}
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "${SCHEME}.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export native screenshots
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/screenshots || true
          fi

      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-results
          path: |
            build/TestResults.xcresult
            build/screenshots
          retention-days: 7
