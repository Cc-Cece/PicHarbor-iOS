name: Unit Tests (Simulator)

# Runs the unit tests on an iOS Simulator. Dispatch + pull-request only, to
# conserve free macOS minutes — the IPA build is the routine job on main.
# Reads the scheme name from project.yml's `name:` field.

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Tests to run
        type: choice
        default: full
        options: [full, native-proxy, paired-link]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: macos-15
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Stable native regression baseline; IPA separately builds with Xcode 26.
          xcode-version: '16.4'

      - name: Set up Python build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache verified Python runtime archive
        uses: actions/cache@v4
        with:
          path: .runtime-cache/*.tar.gz
          key: python-ios-${{ runner.os }}-${{ hashFiles('tools/runtime-lock.json') }}

      - name: Prepare pinned Python runtime and dependencies
        run: python tools/prepare_python.py

      - name: Test adapter offline
        run: |
          python -m pip install -r Python/requirements.lock
          python -m unittest discover -s tests_python -v

      - name: Cache pinned proxy SDK
        uses: actions/cache@v4
        with:
          path: .runtime-cache/clash3-*
          key: proxy-clash3-fbee3cf05b24de4e

      - name: Prepare pinned application proxy SDK
        run: python tools/prepare_proxy.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve app name
        id: app
        run: |
          set -euo pipefail
          NAME=$(awk -F':' '/^name:/{gsub(/["[:space:]]/,"",$2); print $2; exit}' project.yml)
          if [ -z "$NAME" ]; then echo "::error::Could not read 'name:' from project.yml"; exit 1; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          python tools/select_simulator.py >> "$GITHUB_OUTPUT"

      - name: Build native test products before booting the simulator
        timeout-minutes: 20
        env:
          PROJECT_NAME: ${{ steps.app.outputs.name }}
          TEST_SCOPE: ${{ inputs.test_scope || 'full' }}
        run: |
          set -euo pipefail
          SCHEME="$PROJECT_NAME"
          if [ "$TEST_SCOPE" = paired-link ]; then SCHEME=PicHarborLinkScope; fi
          python tools/run_native_checks.py --log build/native-build.log -- xcodebuild build-for-testing \
            -project "${PROJECT_NAME}.xcodeproj" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build/TestBuild -jobs 2 \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO

      - name: Prepare synthetic PhotoKit fixture
        timeout-minutes: 5
        run: |
          xcrun simctl boot '${{ steps.sim.outputs.id }}' || true
          xcrun simctl bootstatus '${{ steps.sim.outputs.id }}' -b
          python tools/generate_ui_fixture.py build/fixtures/picharbor.png
          xcrun simctl addmedia '${{ steps.sim.outputs.id }}' build/fixtures/picharbor.png

      - name: Run tests
        timeout-minutes: 25
        env:
          SCHEME: ${{ steps.app.outputs.name }}
          PROJECT_NAME: ${{ steps.app.outputs.name }}
          TEST_SCOPE: ${{ inputs.test_scope || 'full' }}
        run: |
          set -euo pipefail
          FILTER=(test-without-building)
          if [ "$TEST_SCOPE" = native-proxy ]; then
            FILTER=(test-without-building -only-testing:PicHarborTests -only-testing:PicHarborUITests/HarborFlowTests/testProxyPreviewSettingsAreOffByDefaultAndHavePolicyControls)
          elif [ "$TEST_SCOPE" = paired-link ]; then
            SCHEME=PicHarborLinkScope
            FILTER=(test-without-building -only-testing:PicHarborLinkScopeTests/LiveLinkScopeTests)
          fi
          python tools/run_native_checks.py --log build/native-tests.log -- xcodebuild \
            "${FILTER[@]}" \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/TestBuild \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export native screenshots
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/screenshots || true
          fi

      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-results
          path: |
            build/TestResults.xcresult
            build/screenshots
            build/native-build.log
            build/native-tests.log
          retention-days: 7
